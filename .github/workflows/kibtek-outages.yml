name: KIB-TEK official social notices

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: kibtek-outages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read official Meta posts and OCR notice images
        env:
          META_FACEBOOK_TOKEN: ${{ secrets.META_FACEBOOK_TOKEN }}
          KIBTEK_FACEBOOK_PAGE_ID: ${{ vars.KIBTEK_FACEBOOK_PAGE_ID }}
          KIBTEK_INSTAGRAM_USERNAME: ${{ vars.KIBTEK_INSTAGRAM_USERNAME }}
          OWN_INSTAGRAM_BUSINESS_ID: ${{ vars.OWN_INSTAGRAM_BUSINESS_ID }}
          META_INSTAGRAM_TOKEN: ${{ secrets.META_INSTAGRAM_TOKEN }}
        run: |
          if [ -z "$META_FACEBOOK_TOKEN" ] || [ -z "$KIBTEK_FACEBOOK_PAGE_ID" ]; then
            echo 'Meta access is not configured. No sample notices are published.'
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-tur
          python scripts/sync_kibtek_outages.py
      - name: Commit updated notices
        run: |
          if git diff --quiet -- kesintiler.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kesintiler.json
          git commit -m 'Refresh KIB-TEK official social notices'
          git push
